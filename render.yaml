services:
  - type: web
    name: eac-mro-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn eac_mro.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: eac-mro-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://eac-mro-frontend.vercel.app
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false